<html>

<head>

    <title>GameRate - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-body">

<div class="auth-container">

    <div class="logo">
        🎮 GameRate
    </div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">
        Login to rate your favorite games
    </p>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form action="{{ url_for('login_user') }}" method="POST">

        <label>Email</label>

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>


        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>


        <button type="submit">
            Login
        </button>

    </form>


    <p class="account-text">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </p>

</div>

</body>

</html>
